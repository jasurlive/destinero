<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/flag.png" />
    <link rel="apple-touch-icon" href="/flag.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Destinero | My Travel Map: an interactive map of visited places and future plans."
    />
    <title>Destinero | Travel Map</title>
    <!-- set theme before first paint so dark mode doesn't flash light -->
    <script>
      try {
        // %VITE_ENABLE_EXTRA_THEMES% is filled in by Vite from .env
        var themes = ['light', 'dark']
        if ('%VITE_ENABLE_EXTRA_THEMES%' !== 'false') themes.push('linen', 'fjord', 'matte', 'charcoal', 'paper')
        var pick = function (t) { return themes.indexOf(t) !== -1 ? t : null }
        document.documentElement.dataset.theme =
          pick(new URLSearchParams(location.search).get('theme')) ||
          pick(localStorage.getItem('theme')) ||
          (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
